# Example deployment config for an ArduCopter SITL or live-fire validation.
# Used as: `flyingsquirrel --config examples/sitl-copter.toml`
# Override any individual value via the matching CLI flag.

[sources]
gps_source = "mav"
imu_source = "mav"
controller = "mav"

[mav]
bind = "127.0.0.1:14551"
target = "127.0.0.1:14550"
target_system = 1
target_component = 1
vehicle = "ardu-copter"

[i2c]
# Not using a real I2C IMU here (imu_source = "mav"), but imu_rate also sizes
# the dead-reckoning integration-gap gate for the MAVLink IMU. Set it to the
# autopilot's SCALED_IMU stream rate (ArduPilot SR2_RAW_SENS) — a value far
# above the real rate makes the gate skip every step and stalls dead-reckoning.
imu_rate = 10.0

[boot_anchor]
# This is ArduPilot's default SITL home (CMAC, Canberra), so the example runs
# against SITL out of the box. For ANY real deployment you MUST change this to
# your actual launch-site coordinates: the first GPS fix must land within
# `max_home_distance_m` of this point or the detector emits `BootAnchorRejected`
# and refuses to anchor — that is the meaconing-at-boot defense.
expected_home = "-35.363261,149.165230"
max_home_distance_m = 5000.0

[process]
duration = 600         # 10-minute demo flight
log_level = "info"
json_log = "spoof-events.jsonl"
