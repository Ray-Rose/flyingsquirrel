[package]
name = "flyingsquirrel"
version = "0.1.0"
edition = "2021"
# MSRV = 1.88, the REAL floor of this exact locked tree — re-derived (not
# assumed) after the TUI was split out into `watch/`. The binding constraint
# CHANGED with that split, so the reasoning is worth keeping current:
#   * WAS: darling 0.23 + instability 0.3.12, transitive via ratatui.
#   * NOW: `nmea 0.7 -> serde_with -> time 0.3.47`, which declares 1.88.
#     Reachable on the Linux deploy targets, so it binds the shipped artifact.
#   * Runners-up: hashbrown/deranged/toml_* at 1.85; clap_lex 1.1 needs the
#     edition2024 cargo feature (1.85).
# So removing ratatui did NOT lower the floor — it only moved it onto a CORE
# functional dependency (the NMEA parser) instead of an operator dashboard,
# which is the defensible place for it. Verified with a reachability walk over
# `cargo metadata --filter-platform x86_64-unknown-linux-gnu`, excluding
# dev-deps. The CI `msrv` job builds `--all-features` at this version so the
# claim can never drift from reality (audit I-09); earlier 1.75/1.83/1.85
# values were unverified guesses that did not build.
rust-version = "1.88"
description = "GPS/IMU drift cross-correlator: detects coordinate spoofing by comparing GPS-reported position against IMU-dead-reckoned position."
license = "MIT OR Apache-2.0"
authors = ["Ray Rose"]
repository = "https://github.com/Ray-Rose/flyingsquirrel"
homepage = "https://github.com/Ray-Rose/flyingsquirrel"
readme = "README.md"
keywords = ["gps", "spoofing", "drone", "mavlink", "security"]
categories = ["aerospace", "embedded"]
# Both are detached workspaces with their own lockfiles, excluded from the
# published package: `fuzz/` is a nightly+libFuzzer development harness, and
# `watch/` is the operator dashboard — deliberately kept out of the detector's
# dependency tree (see watch/Cargo.toml for the full rationale).
exclude = ["fuzz/", "watch/"]

[lib]
name = "flyingsquirrel"
path = "src/lib.rs"

[[bin]]
name = "flyingsquirrel"
path = "src/bin/flyingsquirrel.rs"

[[bin]]
name = "mavsim"
path = "src/bin/mavsim.rs"

# NB: `flyingsquirrel-watch` is NOT a bin target here. It lives in `watch/` as
# a detached crate so its TUI dependency tree stays out of the detector's.

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "fs", "net"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
# AUDIT I-01 fix: the `nmea` crate feature-gates EVERY sentence type. With
# only `["std"]` enabled, `parser.parse()` returns `Err(DisabledSentence)`
# for GGA/RMC/VTG — i.e. the serial-GPS backend produced ZERO fixes on real
# hardware (the detector was blind, silently). The `GNSS` bundle enables the
# position/velocity sentence set we actually decode (GGA, RMC, VTG, GSA, GSV,
# GLL, GNS, GST, ...). Verified against nmea-0.7.0 [features] table.
nmea = { version = "0.7", default-features = false, features = ["std", "GNSS"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.9"
mavlink = { version = "0.13", default-features = false, features = ["common", "std"] }
tokio-serial = "5.4"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
toml = "1.1"
sha2 = "0.10"

# Linux-only I2C IMU driver. Pulled in only when explicitly requested by
# enabling the `hw-i2c` feature, and a target_os = "linux" cfg-gate keeps
# Windows/Mac builds free of it entirely.
[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = { version = "0.4", optional = true }
embedded-hal = { version = "1.0", optional = true }
tracing-journald = { version = "0.3", optional = true }

[features]
default = []
hw-i2c = ["dep:linux-embedded-hal", "dep:embedded-hal"]
# `journald` enables structured logging to systemd's journal on Linux.
# Off by default so the Windows/Mac dev path doesn't pull in the dep.
journald = ["dep:tracing-journald"]

[dev-dependencies]
tempfile = "3"
approx = "0.5"
rstest = "0.23"
proptest = "1.5"
tokio = { version = "1.40", features = ["test-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
