name: PX4 SITL bring-up (smoke)

# Step 1 of the PX4 live-SITL milestone. Stands up headless PX4 SITL
# (jonasvautherin/px4-gazebo-headless, which PUSHES MAVLink to a target) and the
# detector receiving directly, to confirm the PX4 topology + GPS/HIGHRES_IMU
# parsing + preflight Ready before the full PX4 closed-loop harness exists. The
# detector-side PX4 support (sever EKF2_GPS_CTRL, PX4 RTL-mode decode) is already
# unit-tested; this is the first LIVE PX4 exercise.
#
# Nightly + on-demand, like sitl.yml (the ArduPilot loop). PX4 SITL is a heavier
# third-party Gazebo image, so this is a separate workflow on its own schedule.
# The bring-up smoke + closed-loop jobs are validated green; the closed loop is
# detector-gated (Spoofed + RTL action + PX4 reaching AUTO.RTL). A third,
# NON-GATING job (px4-action-acked) exercises the experimental external-vision
# fallback that lets PX4 hold an armed RTL through the verify dwell -> the
# stronger ActionAcked read-back; continue-on-error keeps it from ever regressing
# the proven closed-loop gate while the EV-fusion setup is iterated.
on:
  schedule:
    - cron: "47 7 * * *" # ~07:47 UTC nightly (offset from sitl.yml's 07:17)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  px4-smoke:
    name: PX4 SITL bring-up smoke
    runs-on: ubuntu-latest
    # 30 like the other jobs: a slow runner + the heavy Gazebo image pull pushed
    # one dispatch past 25 (cancelled at the timeout, not a real failure).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build detector image (flyingsquirrel:sitl)
        run: docker build -f deploy/Dockerfile -t flyingsquirrel:sitl .

      - name: PX4 bring-up smoke
        run: bash deploy/sitl/run-px4-smoke.sh

      - name: Make detector output readable for upload
        if: always()
        run: sudo chmod -R a+r deploy/sitl/last-run/ 2>/dev/null || true

      - name: Upload detector event log + forensic dumps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: px4-smoke-output
          path: deploy/sitl/last-run/
          if-no-files-found: ignore

  px4-closed-loop:
    name: PX4 SITL closed loop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build detector image (flyingsquirrel:sitl)
        run: docker build -f deploy/Dockerfile -t flyingsquirrel:sitl .

      - name: PX4 closed-loop validation
        run: bash deploy/sitl/run-px4-validation.sh

      - name: Make detector output readable for upload
        if: always()
        run: sudo chmod -R a+r deploy/sitl/last-run/ 2>/dev/null || true

      - name: Upload detector event log + forensic dumps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: px4-closed-loop-output
          path: deploy/sitl/last-run/
          if-no-files-found: ignore

  px4-action-acked:
    name: PX4 SITL ActionAcked (EV fallback, experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NON-GATING: the external-vision fusion setup (EKF2_EV_CTRL + VISION_POSITION_
    # ESTIMATE injection) may need iteration against live PX4, and we must NEVER let
    # it regress the proven px4-closed-loop gate above. This leg proves the STRONGER
    # ActionAcked read-back: with a non-GPS position source, PX4 holds an armed RTL
    # through the detector's verify dwell after the GPS sever (without it, PX4 loses
    # position -> LANDs+disarms -> the detector's armed cross-check correctly returns
    # ActionUnconfirmed — the C-15 trade-off; the detector is unchanged either way).
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build detector image (flyingsquirrel:sitl)
        run: docker build -f deploy/Dockerfile -t flyingsquirrel:sitl .

      - name: PX4 closed-loop validation with EV fallback (assert ActionAcked)
        env:
          PX4_EV_FALLBACK: "1"
          REQUIRE_ACTION_ACKED: "1"
        run: bash deploy/sitl/run-px4-validation.sh

      - name: Make detector output readable for upload
        if: always()
        run: sudo chmod -R a+r deploy/sitl/last-run/ 2>/dev/null || true

      - name: Upload detector event log + forensic dumps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: px4-action-acked-output
          path: deploy/sitl/last-run/
          if-no-files-found: ignore
