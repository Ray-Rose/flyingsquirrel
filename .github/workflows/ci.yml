name: CI

# Runs on every push to a branch and every pull request. The jobs mirror the
# exact commands a developer runs locally (see README "Testing") so a green
# checkmark here means the same thing as a clean local run — and, crucially,
# catches the class of bug where a real-hardware path silently breaks while the
# default test suite stays green (e.g. audit I-01, the NMEA feature regression).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deny warnings everywhere, matching the local clippy gate.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---- Formatting: fast, fail early ----
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # SHA-pinned, so the tag no longer selects the toolchain — name it.
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  # ---- Lint + test on stable ----
  test:
    name: clippy + test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy (all targets, all features, deny warnings)
        # --all-features so the Linux-only hw-i2c + journald code paths are
        # actually compiled and linted in CI (they're off by default and
        # would otherwise never be checked).
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test (default features)
        run: cargo test --all-targets
      - name: test (all features)
        # Re-run with the hardware features on so the I2C / journald code is
        # exercised by the unit tests that don't need real hardware. This is
        # the job that would have caught audit I-01 (NMEA features compiled
        # out → serial GPS silently produced zero fixes).
        run: cargo test --all-targets --all-features
      - name: doc tests
        run: cargo test --doc

  # ---- Windows build + test (the primary development platform for this repo) ----
  windows:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Default features only: hw-i2c + journald are Linux-only (cfg-gated), so the
      # Windows guarantee is the portable core — detector, nav, MAVLink, sim — that
      # a Windows dev actually builds and runs. GitHub's windows runner has none of
      # the local dev-box restrictions (the Application-Control policy that blocks
      # batch test-binary launches), so the full suite is exercised here.
      - name: clippy (default features, deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: test (default features)
        run: cargo test --all-targets

  # ---- MSRV gate: prove the declared rust-version actually builds ----
  msrv:
    name: build @ MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Build only (not clippy/test) — MSRV is about "does it compile on the
      # declared minimum", and older toolchains lint differently. --all-features
      # so the hardware paths are included in the MSRV guarantee. 1.88 is the
      # real floor, set by darling 0.23 + instability 0.3.12 (via ratatui).
      # This job exists because earlier unverified MSRV claims (1.75/1.83/1.85)
      # silently did not build — now the number is continuously proven.
      - run: cargo build --all-targets --all-features --locked

  # ---- Cross-compile for the real deploy targets ----
  cross:
    name: cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu      # Pi 4/5, Jetson, modern ARM SBCs
          - armv7-unknown-linux-gnueabihf  # older Pi, BeagleBone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install cross linker
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y gcc-aarch64-linux-gnu
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
            armv7-unknown-linux-gnueabihf)
              sudo apt-get install -y gcc-arm-linux-gnueabihf
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Build release (hw-i2c + journald, matching deploy/cross-compile.sh)
        run: cargo build --release --locked --features hw-i2c,journald --target ${{ matrix.target }}
      - name: Verify ELF architecture
        run: file "target/${{ matrix.target }}/release/flyingsquirrel"

  # ---- Security advisory scan ----
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Scan dependency tree for RUSTSEC advisories
        # `--deny warnings` fails on any advisory, including informational
        # "unmaintained"/"unsound" notices. THREE transitive advisories are
        # explicitly accepted — none is reachable in the runtime flight path,
        # and none has a semver-compatible patched version available without a
        # major dependency migration:
        #   * RUSTSEC-2024-0436  paste 1.0.15 — UNMAINTAINED. A build-time
        #     proc-macro pulled by nalgebra/simba; abandoned upstream with no
        #     replacement. No runtime code, no vulnerability.
        #   * RUSTSEC-2026-0194 + RUSTSEC-2026-0195  quick-xml 0.36.2 — two DoS
        #     advisories (quadratic duplicate-attribute scan; unbounded
        #     namespace-declaration allocation). quick-xml is a BUILD-dependency
        #     of mavlink-bindgen, used ONLY to parse the VENDORED, trusted
        #     MAVLink dialect XML during codegen at compile time. The detector
        #     never parses untrusted XML at runtime, so neither DoS vector is
        #     reachable in flight. mavlink-bindgen 0.13 pins quick-xml 0.36; the
        #     fix (>=0.41) requires mavlink 0.13->0.18, a breaking wire-path
        #     migration deferred to its own change.
        # NB: RUSTSEC-2026-0190 (anyhow unsound downcast_mut) is deliberately
        # NOT ignored — it was fixed by upgrading anyhow to 1.0.103 in Cargo.lock.
        #
        # REMOVED, not suppressed: RUSTSEC-2026-0002 and RUSTSEC-2026-0253 (both
        # `lru 0.12.5`, unsound) used to be ignored here on the grounds that lru
        # reached us only through ratatui's widget cache in the operator TUI and
        # never through the detector. That was true but unenforced — the TUI was
        # a bin target in this same package, so `lru` sat in the detector's
        # lockfile, its ARM cross-builds, its Docker image, and even
        # `fuzz/Cargo.lock`. Moving the dashboard to the detached `watch/` crate
        # made the claim structural: `lru` is no longer in this tree at all, so
        # the advisories are gone rather than argued. `watch/` runs its own audit
        # (see the `watch` job) where those two are ignored with that same
        # rationale — but now it is the honest scope.
        # Real vulnerabilities and any NEW advisory still fail this gate.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  # ---- Operator dashboard: detached crate, so it needs its own gate ----
  watch:
    name: watch TUI (detached crate)
    runs-on: ubuntu-latest
    # `watch/` has its own workspace and lockfile, so NOTHING in the jobs above
    # compiles it — `cargo test` at the root cannot see it. Without this job the
    # dashboard would rot silently, which is the standing cost of detaching a
    # crate and the reason `fuzz/` carries an equivalent build gate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: watch
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets --manifest-path watch/Cargo.toml -- -D warnings
      - name: fmt
        run: cargo fmt --manifest-path watch/Cargo.toml -- --check
      - name: test
        run: cargo test --all-targets --manifest-path watch/Cargo.toml
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Scan the dashboard's own dependency tree
        # The two `lru 0.12.5` unsoundness advisories (RUSTSEC-2026-0002 IterMut,
        # RUSTSEC-2026-0253 pop) live HERE now, which is the honest scope: lru
        # arrives solely via ratatui's widget cache, and ratatui 0.29 pins
        # `lru = 0.12` so no semver-compatible patched version exists. This is a
        # log-reading dashboard, not the flight-path detector — the same
        # rationale the root gate used to carry, except now the build enforces
        # the boundary instead of a comment asserting it.
        # `paste` (RUSTSEC-2024-0436, unmaintained build-time proc-macro) also
        # reaches ratatui. Revisit all three when ratatui next releases.
        run: cargo audit --deny warnings --file watch/Cargo.lock --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2026-0253

  # ---- Docker image build (validates deploy/Dockerfile) ----
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: flyingsquirrel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
