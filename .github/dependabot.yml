# Keeps the SHA-pinned GitHub Actions, the Docker base-image digests, and the
# Cargo dependency tree from going stale. SHA/digest pinning is a supply-chain
# hardening (an attacker can't repoint a tag to malicious code), but WITHOUT an
# updater it would freeze security patches. With Dependabot, every pinned action,
# base image, and crate gets an update PR — reproducible AND current.
#
# Cargo security updates here are what would have surfaced the RUSTSEC advisories
# that the per-push `cargo audit` gate later caught (anyhow/quick-xml, mid-2026)
# — automatically, and earlier.
version: 2
updates:
  # GitHub Actions — every workflow pins actions by commit SHA. `directory: "/"`
  # scans all of `.github/workflows/`, so a newly added workflow (fuzz.yml was
  # the most recent) is covered without touching this file.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One grouped PR for routine action bumps instead of one per action.
      actions:
        patterns: ["*"]

  # Rust crates. Bumps are PROPOSED only; the MSRV (1.88) + clippy + full test
  # gates in ci.yml still have to pass before anything merges, so a bump that
  # breaks the pinned/MSRV-sensitive tree is caught, not shipped.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The fuzz harness is a SEPARATE, detached workspace (`fuzz/Cargo.toml` has
  # its own `[workspace]`, and the root manifest excludes it), so the `/` entry
  # above does not reach it — a detached lockfile is invisible to both this
  # updater and the root `cargo audit` gate.
  #
  # It needs its own entry for a reason specific to what fuzzing is FOR: the
  # targets deliberately mirror the parent's `mavlink` and `nmea` versions so
  # they exercise the code that actually ships. Left unmanaged, that mirror
  # silently drifts and the nightly search starts reporting green over a
  # decoder the detector no longer uses — the exact bitrot `fuzz.yml`'s build
  # job exists to prevent, arriving through the dependency tree instead.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # The operator dashboard, also a detached workspace (see watch/Cargo.toml).
  # It carries the TUI stack — ratatui and its `lru`/`paste` advisories — which
  # is exactly why it is not in the detector's tree. Keeping it updated here is
  # how the eventual ratatui release that drops those advisories reaches us.
  - package-ecosystem: cargo
    directory: "/watch"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Docker base images in the shipped detector image (deploy/Dockerfile).
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
